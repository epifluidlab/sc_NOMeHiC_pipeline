# working directory
workdir: "/gpfs/projects/b1198/epifluidlab/yoshii/sc_nomehic_cellline/gm_sc_new"

# reference genome
reference: "/gpfs/projects/b1198/epifluidlab/yoshii/reference/hg38/GCA_000001405.15_GRCh38_no_alt_analysis_set"
variants: "/gpfs/projects/b1198/epifluidlab/yoshii/reference/hg38/Homo_sapiens_assembly38.dbsnp138.vcf"
restriction_sites: "/gpfs/projects/b1198/epifluidlab/yoshii/reference/hg38/GCA_000001405.15_GRCh38_no_alt_analysis_set.fa_DpnII.txt"

# software
picard: "/gpfs/projects/b1198/epifluidlab/yoshii/software/picard/picard.jar"
bisulfitehic: "/gpfs/projects/b1198/epifluidlab/yoshii/software/bisulfiteHic"
bissnp_jar: "/gpfs/projects/b1198/epifluidlab/yoshii/software/Bis-tools/Bis-SNP/Bis-SNP.latest.jar"
bistools: "/gpfs/projects/b1198/epifluidlab/yoshii/software/Bis-tools"
# NOTE: bistools/Bis-SNP/bissnp_nomehic_usage.pl is the scNOMe-HiC wrapper used by rule bistools.
scripts: "/gpfs/projects/b1198/epifluidlab/yoshii/software/sc_NOMeHiC_pipeline/scripts"

# ──────────────────────────────────────────────────────────────────────────
# Pipeline starting mode
#
#   "raw"     — start from raw paired fastqs in `data/`. The workflow runs
#               demultiplex_fastqc_trim and continues from mapping onward.
#               `data` must contain files named `{prefix}_R1_001.fastq.gz`
#               and `{prefix}_R2_001.fastq.gz`; prefixes are auto-discovered.
#
#   "trimmed" — start from already-trimmed fastqs in
#               `03.trimmed_fastq_snakemake/{prefix}.{index}.R1_val_1.fq.gz`
#               (and R2_val_2.fq.gz). The demultiplex_fastqc_trim rule and
#               the 02.fastqc targets are skipped. `fastq_prefixes` (below)
#               must list the cell prefixes.
# ──────────────────────────────────────────────────────────────────────────
start_from: "raw"

# fastq input directory and single cell index
data: "00.raw_data/"
fileindex: "00.raw_data/index.txt"

# Trimmed-fastq directory. Used as:
#   - the output dir for `demultiplex_fastqc_trim` (start_from == "raw")
#   - the input dir for `mapping`        (both modes)
#   - the scan dir for auto-discovery    (start_from == "trimmed", no list set)
# Path is relative to workdir unless absolute. Override when your already-
# trimmed fastqs live in a non-default location.
trimmed_data: "03.trimmed_fastq_snakemake"

# Which cell prefixes to process under start_from == "trimmed", in order of
# precedence (set ONE; ignored when start_from == "raw"):
#   1. fastq_prefixes      — inline list (small datasets, <= ~10 cells)
#   2. fastq_prefixes_file — path to a one-per-line text file (large datasets)
#   3. (default) auto-discover from `trimmed_data` — every
#      {prefix}.{index}.R1_val_1.fq.gz file present, where {index} matches
#      one of the values in `fileindex`.
# fastq_prefixes:
#   - batch5_scD_1
# fastq_prefixes_file: "prefixes.txt"

# adapter trimming parameters
clip_r1: 15
clip_r2: 15
three_prime_clip_r1: 5
three_prime_clip_r2: 5

# GCHnorm genome intervals
hg38_5kb_no_dark_regions: "/gpfs/projects/b1198/epifluidlab/yoshii/reference/hg38/genome_bins_5kb.bed"
hg38_250kb_no_dark_regions: "/gpfs/projects/b1198/epifluidlab/yoshii/reference/hg38/genome_bins_250kb.bed"

# qc analysis thresholds
fragnum_threshold: 80000
noncpg_threshold: 5
GCH_threshold: 1000000
HCG_threshold: 150000
transrate_threshold: 0.7
cis1kbnum_threshold: 2000
