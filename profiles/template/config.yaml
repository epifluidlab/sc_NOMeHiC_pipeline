# Per-project pipeline config — copy this file into your project directory and
# edit the values below. Anything you DON'T set here is inherited from the
# repo's configs/config.yaml (reference paths, software paths, qc thresholds,
# etc), so this file only needs the project-specific bits.

# Absolute path to this project's working directory. All pipeline outputs land
# here as subdirectories (01.demul_fastq_snakemake/, 04.alignment_snakemake/,
# 07.bistools_snakemake/, 08.methylation_snakemake/, etc).
workdir: "/projects/b1198/epifluidlab/yoshii/runs/REPLACE_ME"

# Pipeline starting mode:
#   "raw"     — start from raw paired fastqs in `data/` (runs demultiplex + fastqc + trim)
#   "trimmed" — start from already-trimmed fastqs in 03.trimmed_fastq_snakemake/
#               (skips demux + fastqc + trim; requires `fastq_prefixes` below)
start_from: "raw"

# Raw fastq directory (relative to workdir). Used only when start_from == "raw".
# Files must be named {prefix}_R1_001.fastq.gz and {prefix}_R2_001.fastq.gz.
data: "00.raw_data/"

# Single-cell index file (relative to workdir). One index per line.
fileindex: "00.raw_data/index.txt"

# Which cell prefixes to process under start_from == "trimmed". Pick ONE
# (in order of precedence; ignored when start_from == "raw"):
#
#   1. fastq_prefixes — inline list. Best when you have only a few cells.
# fastq_prefixes:
#   - batch5_scD_1
#   - batch5_scD_2
#
#   2. fastq_prefixes_file — path to a text file, one prefix per line. Best
#      when you have hundreds of cells (avoid bloating the yaml).
# fastq_prefixes_file: "prefixes.txt"
#
#   3. (default) auto-discover — leave both above unset and the pipeline
#      will scan 03.trimmed_fastq_snakemake/ for every
#      {prefix}.{index}.R1_val_1.fq.gz file. Best when you've staged the
#      trimmed inputs but don't want to maintain a separate prefix list.
#
# Trimmed inputs in any case must live at
#   03.trimmed_fastq_snakemake/{prefix}.{index}.R1_val_1.fq.gz
# (and R2_val_2.fq.gz) for each index listed in fileindex.

