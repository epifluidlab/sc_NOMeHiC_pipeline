# Per-project pipeline config — self-contained.
#
# Copy this file into your project directory, edit the values, and pass it
# as the ONLY --configfile to snakemake. No need to also pass the repo's
# configs/config.yaml — every field the pipeline needs is set here.
#
# Everything is grouped:
#   1. Project-specific (edit per run): workdir, start_from, inputs
#   2. Shared paths      (rarely change): reference, software
#   3. Tuning            (rarely change): trimming params, qc thresholds
# ──────────────────────────────────────────────────────────────────────────

# ─── 1. PROJECT-SPECIFIC ──────────────────────────────────────────────────

# Absolute path to this project's working directory. All pipeline outputs land
# here (01.demul_fastq_snakemake/, 04.alignment_snakemake/, 07.bistools_snakemake/,
# 08.methylation_snakemake/, etc).
workdir: "/projects/b1198/epifluidlab/yoshii/runs/REPLACE_ME"

# Pipeline starting mode:
#   "raw"     — start from raw paired fastqs in `data/` (runs demultiplex + fastqc + trim)
#   "trimmed" — start from already-trimmed fastqs in `trimmed_data/`
#               (skips demux + fastqc + trim)
start_from: "raw"

# Raw fastq directory (relative to workdir, or absolute). Used when start_from == "raw".
# Files must be named {prefix}_R1_001.fastq.gz and {prefix}_R2_001.fastq.gz.
data: "00.raw_data/"

# Single-cell index file (relative to workdir, or absolute). One index per line.
fileindex: "00.raw_data/index.txt"

# Trimmed-fastq directory. Used as the output dir for demultiplex_fastqc_trim
# (raw mode), as the input dir for `mapping` (both modes), and as the scan
# dir for auto-discovery (trimmed mode, no list configured).
trimmed_data: "03.trimmed_fastq_snakemake"

# Which cell prefixes to process under start_from == "trimmed". Pick ONE
# (in order of precedence; ignored when start_from == "raw"):
#
#   1. fastq_prefixes — inline list. Best when you have only a few cells.
# fastq_prefixes:
#   - batch5_scD_1
#   - batch5_scD_2
#
#   2. fastq_prefixes_file — path to a text file, one prefix per line. Best
#      when you have hundreds of cells.
# fastq_prefixes_file: "prefixes.txt"
#
#   3. (default) auto-discover — leave both above unset and the pipeline
#      scans `trimmed_data` for every {prefix}.{index}.R1_val_1.fq.gz file.

# ─── 2. SHARED PATHS ──────────────────────────────────────────────────────

# Reference genome (path without extension; .fa, .fa.fai, .chrom.sizes, etc are
# derived from this).
reference: "/gpfs/projects/b1198/epifluidlab/yoshii/reference/hg38/GCA_000001405.15_GRCh38_no_alt_analysis_set"
variants: "/gpfs/projects/b1198/epifluidlab/yoshii/reference/hg38/Homo_sapiens_assembly38.dbsnp138.vcf"
restriction_sites: "/gpfs/projects/b1198/epifluidlab/yoshii/reference/hg38/GCA_000001405.15_GRCh38_no_alt_analysis_set.fa_DpnII.txt"

# Software paths
picard: "/gpfs/projects/b1198/epifluidlab/yoshii/software/picard/picard.jar"
bisulfitehic: "/gpfs/projects/b1198/epifluidlab/yoshii/software/bisulfiteHic"
bissnp_jar: "/gpfs/projects/b1198/epifluidlab/yoshii/software/Bis-tools/Bis-SNP/Bis-SNP.latest.jar"
bistools: "/gpfs/projects/b1198/epifluidlab/yoshii/software/Bis-tools"
scripts: "/gpfs/projects/b1198/epifluidlab/yoshii/software/sc_NOMeHiC_pipeline/scripts"

# GCHnorm genome intervals (used by rules/GCHnorm.smk; only needed if you
# enable that workflow)
hg38_5kb_no_dark_regions: "/gpfs/projects/b1198/epifluidlab/yoshii/reference/hg38/genome_bins_5kb.bed"
hg38_250kb_no_dark_regions: "/gpfs/projects/b1198/epifluidlab/yoshii/reference/hg38/genome_bins_250kb.bed"

# ─── 3. TUNING ────────────────────────────────────────────────────────────

# Methylation per-bin output. Produces one TSV per (cell, context, bin_def)
# under 08.methylation_snakemake/, named
#   {prefix}.{index}.{context}.{label}_methylation.txt
# Both GCH and HCG contexts are always computed. Bin definitions are either
# fixed-size genome-wide tiling, custom region BEDs, or both:
methylation_bin_sizes:
  - 1000
  - 50000
  - 100000
  - 250000

# Custom region BEDs. Each key is the label used in the output filename
# (must start with a letter). Each value is a path to a 3- or 4-column BED
# (chr/start/end, plus optional name). Header rows are auto-skipped.
# methylation_region_beds:
#   gene_tss:  /gpfs/projects/b1198/epifluidlab/yoshii/reference/hg38/genome_bins_gene_tss.bed
#   gene_body: /gpfs/projects/b1198/epifluidlab/yoshii/reference/hg38/genome_bins_gene_body.bed

# Adapter trimming parameters (used by demultiplex_fastqc_trim → trim_galore)
clip_r1: 15
clip_r2: 15
three_prime_clip_r1: 5
three_prime_clip_r2: 5

# QC analysis thresholds (used by rules/scnomehic_analysis.smk rule qc)
fragnum_threshold: 80000
noncpg_threshold: 5
GCH_threshold: 1000000
HCG_threshold: 150000
transrate_threshold: 0.7
cis1kbnum_threshold: 2000
