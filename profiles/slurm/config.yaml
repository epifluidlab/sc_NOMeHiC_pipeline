executor: slurm
keep-going: true
restart-times: 3

# Conda env management is off by default — the Snakefile's shell.prefix() puts
# the scnomehic and hic_env conda envs on PATH for every rule, which covers
# every binary the workflow needs (samtools, bedtools, perl, python, hicluster,
# bedGraphToBigWig, ...). Re-enable via --use-conda on the CLI if you actually
# want snakemake to build per-rule envs from the rules/../envs/*.yaml files.
# use-conda: true

default-resources:
  slurm_partition: "genomics"
  slurm_account: "b1042"
  runtime: 2880
  mem_mb: 128000
cores: 16
